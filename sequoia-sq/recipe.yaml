context:
  version: 1.3.1
  build_number: 0

package:
  name: sequoia-sq
  version: ${{ version }}

source:
  - url: https://gitlab.com/sequoia-pgp/sequoia-sq/-/archive/v${{ version }}/sequoia-sq-v${{ version }}.tar.gz
    sha256: 9f112096f413e195ec737c81abb5649604f16e1f6dbe64a8accc5bb3ad39e239

build:
  number: ${{ build_number }}
  script:
    content:
      - ${BUILD_PREFIX}/bin/cargo auditable install --no-track
        --locked --path "${SRC_DIR}" --root "${PREFIX}"
        --features=crypto-openssl --no-default-features --debug
      - install -vDm 0644 "${SRC_DIR}/target/assets/shell-completions/sq.bash"
        "${PREFIX}/share/bash-completion/completions/sq"
      - install -vDm 0644 "${SRC_DIR}/target/assets/shell-completions/_sq"
        -t "${PREFIX}/share/zsh/site-functions/"
      - install -vDm 0644 "${SRC_DIR}/target/assets/shell-completions/sq.fish"
        -t "${PREFIX}/share/fish/vendor_completions.d/"
      - install -vDm 0644 "${SRC_DIR}"/target/assets/man-pages/*.1
        -t "${PREFIX}/share/man/man1/"
      - ${BUILD_PREFIX}/bin/cargo-bundle-licenses --format yaml
        --output "${SRC_DIR}/THIRDPARTY.yml"
    env:
      ASSET_OUT_DIR: target/assets
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_DEBUG_LTO: thin
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_DEBUG_STRIP: symbols
      # CARGO_PROFILE_RELEASE_OPT_LEVEL: "1"
      # CARGO_PROFILE_RELEASE_DEBUG: "true"
      # CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
      # CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
      # CARGO_PROFILE_RELEASE_INCREMENTAL: "true"
      CARGO_BUILD_TARGET_DIR: target
      CARGO_BUILD_BUILD_DIR: build
      # LIBCLANG_PATH: ${BUILD_PREFIX}/lib
      # PKG_CONFIG_PATH: ${PREFIX}/lib/pkgconfig

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('rust') }}
    - capnproto
    - cargo-auditable
    - cargo-bundle-licenses
    - clang
    - libclang
    - pkg-config
    - uutils-coreutils
  host:
    - openssl
    - sqlite

tests:
  - script:
      - sq version
      - sq key list

about:
  homepage: https://sequoia-pgp.org
  repository: https://gitlab.com/sequoia-pgp/sequoia-sq
  documentation: https://book.sequoia-pgp.org
  summary: The Sequoia-PGP command line tool
  description: >-
    Sequoia-PGP is an implementation of OpenPGP in Rust. sq is aimed
    at command line users as a way to use OpenPGP conveniently from the
    command line.
  license: LGPL-2.0-or-later
  license_file:
    - LICENSE.txt
    - THIRDPARTY.yml
