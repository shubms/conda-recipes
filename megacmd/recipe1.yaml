context:
  version: 2.5.2
  build: 1

package:
  name: megacmd
  version: ${{ version }}

source:
  - url: "https://github.com/meganz/MEGAcmd/archive/refs/tags/${{ version }}_Linux.tar.gz"
    # https://mega.nz/linux/repo/Arch_Extra/x86_64/megacmd-${{ version }}-${{ build }}-x86_64.pkg.tar.zst
    sha256: a088c001e9116357fcac92cd0b3d62fb53cc24ce546eb0fb4cc83c53df5eed7c

build:
  number: ${{ build }}
  script:
    content:
      - cmake -B build/build-cmake-Release -DCMAKE_BUILD_TYPE=Release -DVCPKG_ROOT=${SRC_DIR}/vcpkg
      - cd build/build-cmake-Release
      - cmake --build
      # - cp --recursive "${SRC_DIR}/usr/bin" "${PREFIX}/bin"
      # - cp --recursive "${SRC_DIR}/opt/megacmd/lib" "${PREFIX}"

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - cmake
    - vcpkg

about:
  homepage: https://mega.io/cmd
  repository: https://github.com/meganz/MEGAcmd
  summary: MEGA Command Line Interactive and Scriptable Application
  description: >-
    MEGAcmd provides non UI access to MEGA services.
    It intends to offer all the functionality with your MEGA
    account via commands.
  license: BSD-3-Clause
  license_file: LICENSE
